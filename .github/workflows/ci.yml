name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building DevOps WebApp..."
          test -f index.html
          echo "Build successful!"

      - name: Run tests
        run: |
          echo "Running tests..."
          test -f index.html
          echo "Tests passed!"

      - name: Send Slack notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="CI Pipeline SUCCESS for DevOps WebApp"
          else
            MESSAGE="CI Pipeline FAILED for DevOps WebApp"
          fi

          curl -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"$MESSAGE\"}" \
            "${{ secrets.SLACK_WEBHOOK }}"
